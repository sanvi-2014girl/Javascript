<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{text-align: center;
            color: rgb(230, 113, 132);
            
        }
        button{height: 50px;
            width: 100px;
            color: rgb(230, 113, 132);
        }
        div{
            text-align: left;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>My Game Profile</h1>
    <center><button onclick="showProfile()">Show Profile</button></center>

    <div>Name: <span id = "name"></span></div>
    <hr>
    <div>Score: <span id="score"></span></div><hr>
    <div>Top Score: <span id="record"></span></div><hr>
    <div>Rank: <span id="rank"></span></div>
    <hr>
    
    <div>Greeting: <span id="greeting"></span></div><hr>
    <div>Stars: <span id="stars"></span></div><hr>
    <div>Bonus Level: <span id="bonus"></span></div><hr>
    <div>Team Name: <span id="team"></span></div><hr>

    <script>
        function showProfile() {
            let name = "Sannvi";
            let myScore = 99 ;
            let highScore = 100;
            let bonus = null;
            let team;
            let isTopScore = myScore == highScore;
            let rank;
            if(myScore >= 80) {
                rank = "Gold";
            } else if (myScore >= 50) {
                rank = "Silver";
            } else{
                rank = "Bronze";
            }

            let hour = new Date().getHours();
            let greeting;
            if (hour < 12) {
                greeting = "Good Morning!";
            }else if (hour < 17) {
                greeting = "Good Afternoon!";
            }else {
                greeting = "Good Evening!";
            }

            let stars = "";
            let count = 0;
            while (count < 5) {
                stars = stars + "* ";
                count = count +1;
            }
            document.getElementById("name").innerHTML = name;
            document.getElementById("score").innerHTML = myScore+"out of"+ highScore;
            document.getElementById("record").innerHTML = isTopScore;
            document.getElementById("rank").innerHTML = rank;
            document.getElementById("greeting").innerHTML = greeting;
            document.getElementById("stars").innerHTML = stars;
            document.getElementById("bonus").innerHTML = bonus;
            document.ElementById("team").innerHTML=("team");

        }
    </script>
    
</body>
</html>
